---
- name: Locate most recent backup snapshot
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Search for available backup directories
      ansible.builtin.find:
        paths: "backups"
        file_type: directory
      register: backup_folders

    - name: Validate that backups exist
      ansible.builtin.fail:
        msg: "No directory found in 'backups/'."
      when: backup_folders.files | length == 0

    - name: Select the most recent timestamp
      ansible.builtin.set_fact:
        latest_backup_dir: "{{ (backup_folders.files | sort(attribute='ctime') | last).path }}"

- name: Restore configuration on all 4 lab nodes
  hosts: "mikrotik_lab:!oob-master"
  gather_facts: false
  vars:
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    target_backup_dir: "{{ hostvars['localhost']['latest_backup_dir'] }}"

  tasks:
    - name: 1. Upload .backup file to the router via SCP
      ansible.builtin.command: >
        scp -P {{ ansible_port | default(22) }}
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -i {{ ssh_key }}
        "{{ target_backup_dir }}/{{ inventory_hostname }}.backup"
        {{ ansible_user | default('admin') }}@{{ ansible_host }}:restore.backup
      delegate_to: localhost
      changed_when: true

    - name: 2. Trigger restore in the background using :execute
      community.routeros.command:
        commands:
          - ':execute {/system backup load name="restore.backup" password=""}'

    - name: 3. Wait for the router to drop the connection (reboot in progress)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        state: stopped
        delay: 3
        timeout: 30
      delegate_to: localhost

    - name: 4. Wait for the router to come back up after reboot
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        state: started
        delay: 15
        timeout: 120
      delegate_to: localhost

    - name: 5. Check actual uptime after startup
      community.routeros.command:
        commands:
          - ":put [/system resource get uptime]"
      register: new_uptime

    - name: 6. Confirm node has been restored
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} successfully restored (Uptime: {{ new_uptime.stdout[0] | trim }})"
