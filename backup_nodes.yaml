---
- name: Extract backup copies from MikroTik infrastructure
  hosts: all
  gather_facts: false

  tasks:
    - name: 1. Set static backup directory and create it on WSL
      block:
        - name: Generate unique backup path
          ansible.builtin.set_fact:
            local_backup_dir: "backups/{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
          run_once: true

        - name: Create local directory on WSL
          ansible.builtin.file:
            path: "{{ local_backup_dir }}"
            state: directory
            mode: "0755"
          run_once: true
      delegate_to: localhost

    - name: 2. Export text configuration (.rsc) via console
      community.routeros.command:
        commands:
          - /export compact
      register: rsc_export

    - name: 3. Save .rsc file on the local controller
      ansible.builtin.copy:
        content: "{{ rsc_export.stdout[0] }}"
        dest: "{{ local_backup_dir }}/{{ inventory_hostname }}.rsc"
        mode: "0644"
      delegate_to: localhost

    - name: 4. Generate binary backup on the router (.backup)
      community.routeros.command:
        commands:
          - /system backup save name=snap_ansible

    - name: 5. Locate exact path of the binary file in storage
      community.routeros.command:
        commands:
          - ':put [/file get [find name~"snap_ansible"] name]'
      register: remote_file_path

    - name: 6. Download binary backup via SCP to the local controller
      ansible.builtin.command: >
        scp -P {{ ansible_port | default(22) }}
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -i {{ lookup('env', 'HOME') }}/.ssh/id_rsa
        {{ ansible_user | default('admin') }}@{{ ansible_host }}:"{{ remote_file_path.stdout[0] | trim }}"
        {{ local_backup_dir }}/{{ inventory_hostname }}.backup
      delegate_to: localhost
      changed_when: true

    - name: 7. Remove temporary binary file from the router
      community.routeros.command:
        commands:
          - /file remove [find name~"snap_ansible"]
