---
- name: Localizar snapshot de respaldo más reciente
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Buscar directorios de backup disponibles
      ansible.builtin.find:
        paths: "backups"
        file_type: directory
      register: backup_folders

    - name: Validar existencia de copias
      ansible.builtin.fail:
        msg: "No se encontró ningún directorio en 'backups/'."
      when: backup_folders.files | length == 0

    - name: Seleccionar marca temporal más reciente
      ansible.builtin.set_fact:
        latest_backup_dir: "{{ (backup_folders.files | sort(attribute='ctime') | last).path }}"

- name: Restaurar configuración en los 4 nodos del laboratorio
  hosts: "mikrotik_lab:!oob-master"
  gather_facts: false
  vars:
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    target_backup_dir: "{{ hostvars['localhost']['latest_backup_dir'] }}"

  tasks:
    - name: 1. Subir archivo .backup al router vía SCP
      ansible.builtin.command: >
        scp -P {{ ansible_port | default(22) }}
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -i {{ ssh_key }}
        "{{ target_backup_dir }}/{{ inventory_hostname }}.backup"
        {{ ansible_user | default('admin') }}@{{ ansible_host }}:restore.backup
      delegate_to: localhost
      changed_when: true

    - name: 2. Disparar restauración en segundo plano con :execute
      community.routeros.command:
        commands:
          - ':execute {/system backup load name="restore.backup" password=""}'

    - name: 3. Esperar a que el router corte la conexión (Reinicio en curso)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        state: stopped
        delay: 3
        timeout: 30
      delegate_to: localhost

    - name: 4. Esperar a que el router vuelva a levantar tras el reinicio
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        state: started
        delay: 15
        timeout: 120
      delegate_to: localhost

    - name: 5. Comprobar uptime real tras el inicio
      community.routeros.command:
        commands:
          - ":put [/system resource get uptime]"
      register: new_uptime

    - name: 6. Confirmación de nodo restaurado
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} restaurado con éxito (Uptime: {{ new_uptime.stdout[0] | trim }})"
