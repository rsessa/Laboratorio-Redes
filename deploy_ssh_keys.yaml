---
- name: Deploy SSH keys on MikroTik lab devices
  hosts: mikrotik_lab
  gather_facts: false

  vars:
    ssh_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    ssh_pub_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
    remote_key_filename: "ansible_key.pub"

  tasks:
    - name: Ensure the SSH key pair exists on the local controller
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: rsa
        size: 4096
        state: present
      delegate_to: localhost
      run_once: true

    - name: Transfer public key to the router via SCP
      ansible.builtin.command: >
        sshpass -p "{{ ansible_password }}"
        scp -P {{ ansible_port }}
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        {{ ssh_pub_key_path }}
        {{ ansible_user }}@{{ ansible_host }}:{{ remote_key_filename }}
      delegate_to: localhost
      changed_when: true

    - name: Import SSH key into RouterOS
      community.routeros.command:
        commands:
          - "/user ssh-keys import public-key-file={{ remote_key_filename }} user={{ ansible_user }}"
      register: import_result
      # RouterOS automatically removes the .pub file from storage after importing it
      failed_when:
        - import_result.failed is defined and import_result.failed
        - "'already' not in (import_result.msg | default(''))"

    - name: Verify imported key on the node
      community.routeros.command:
        commands:
          - "/user ssh-keys print"
      register: keys_status

    - name: Display authorized keys status
      ansible.builtin.debug:
        msg: "{{ keys_status.stdout_lines[0] }}"
